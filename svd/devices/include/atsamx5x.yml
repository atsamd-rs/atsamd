# CCBUF & DITHERBUF wrong offset & size for CCBUF_DITH4_MODE
"TCC?":
  "CCBUF_DITH4_MODE?%s?":
    _modify:
      DITHERBUF:
        bitOffset: 0
        bitWidth: 4
      CCBUF:
        bitOffset: 4
        bitWidth: 20

# The NVMCTRL::PARAM::SEE field is specified as 1 bit wide, but several
# devices include much wider enumeration values that don't correspond to
# the actual values expected for this field.
NVMCTRL:
  PARAM:
    SEE:
      _replace_enum:
        _name: SEESelect
        SMARTEEPROM: [0x1, "SmartEEPROM is supported"]
        NOSMARTEEPROM: [0x0, "No SmartEEPROM support"]

# The SDHC peripheral on some devices contains reset values for certain
# fields that are wider than their corresponding storage. Replace the
# invalid values with the ones from the datasheet.
"SDHC?":
  _modify:
    HC1R:
      resetValue: 0x00
    HC1R_EMMC_MODE:
      resetValue: 0x00
    SISR:
      resetValue: 0x00

# The TCn::COUNTn::CTRLA::DMAOS fields are all missing.
"TC?":
  "*":
    CTRLA:
      _add:
        DMAOS:
          description: DMA One-Shot Trigger Mode
          bitOffset: 15
          bitWidth: 1

# EVSYS::CHANNEL[%s] cluster is misnamed; should be CHANNELS[%s].
EVSYS:
  _modify:
    "CHANNEL?%s?":
      name: "CHANNELS[%s]"

# The SERCOM USART TXPO enumerated values of the original SVD don't match
# the datasheet.
"SERCOM?":
  USART_INT:
    CTRLA:
      TXPO:
        _replace_enum:
          _name: TXPOSelect
          TXPO_0: [0x0, "TxD on PAD0, XCK on PAD1"]
          TXPO_2: [0x2, "TxD on PAD0, RTS/TE on PAD2, CTS on PAD3"]
          TXPO_3: [0x3, "TxD on PAD0, XCK on PAD1, RTS/TE on PAD2"]
  USART_EXT:
    CTRLA:
      TXPO:
        _replace_enum:
          _name: TXPOSelect
          TXPO_0: [0x0, "TxD on PAD0, XCK on PAD1"]
          TXPO_2: [0x2, "TxD on PAD0, RTS/TE on PAD2, CTS on PAD3"]
          TXPO_3: [0x3, "TxD on PAD0, XCK on PAD1, RTS/TE on PAD2"]

# The DMAC trigger sources in the original SVD only have the 0=disabled
# enumeration value.
DMAC:
  "CHANNEL?%s?":
